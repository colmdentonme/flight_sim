<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flight SOP Checklists</title>
<meta name="description" content="Interactive aircraft SOP checklists for iPad">

<meta name="theme-color" id="theme-color-meta" content="#f4f6f9">
<link rel="manifest" href="manifest.json">

<!-- iOS home screen / standalone support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SOP Checklists">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<script>
  // Applied before first paint so a saved dark-mode/text-size choice doesn't flash the default first.
  try {
    var t = localStorage.getItem("sop:theme");
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
    var ts = localStorage.getItem("sop:textSize");
    if (ts === "sm" || ts === "lg") document.documentElement.setAttribute("data-text-size", ts);
  } catch (e) { /* storage unavailable, defaults apply */ }
</script>
</head>
<body>

<div id="app">

  <!-- ============ HOME / AIRCRAFT LIBRARY ============ -->
  <section id="home-view">
    <header id="home-header">
      <div id="home-header-title">
        <div id="home-title">Flight Checklists</div>
        <div id="home-sub">Choose a checklist</div>
      </div>
      <button id="theme-toggle-btn-home" class="icon-btn theme-toggle-btn" aria-label="Toggle light/dark theme">
        <span class="theme-icon">&#x2600;</span>
      </button>
    </header>
    <main id="home-main">
      <button id="continue-card" type="button" hidden>
        <div id="continue-label">Continue</div>
        <div id="continue-title"></div>
        <div id="continue-meta"></div>
      </button>
      <ul id="aircraft-list"></ul>
    </main>
  </section>

  <!-- ============ CHECKLIST VIEW ============ -->
  <section id="checklist-view" hidden>

    <header id="app-header">
      <button id="menu-btn" class="icon-btn" aria-label="Open phase menu" aria-expanded="false" aria-controls="phase-drawer">
        <span class="bars"></span>
      </button>

      <div id="header-title">
        <div id="phase-title">&nbsp;</div>
        <div id="phase-sub">&nbsp;</div>
      </div>

      <div id="header-actions">
        <button id="search-btn" class="icon-btn" aria-label="Search this checklist">
          <span class="search-icon"></span>
        </button>
        <button id="theme-toggle-btn" class="icon-btn theme-toggle-btn" aria-label="Toggle light/dark theme">
          <span class="theme-icon">&#x2600;</span>
        </button>
        <button id="reset-btn" class="icon-btn" aria-label="Reset checklist for new flight">
          <span class="reset-icon">&#x21bb;</span>
        </button>
      </div>
    </header>

    <div id="progress-track" aria-hidden="true">
      <div id="progress-fill"></div>
    </div>

    <button id="return-banner" type="button" hidden>
      <span class="return-banner-icon">&#x21a9;</span>
      <span id="return-banner-label"></span>
    </button>

    <nav id="phase-drawer" aria-label="Checklist phases">
      <div id="phase-drawer-header">
        <span>Phases</span>
        <button id="drawer-close-btn" class="icon-btn" aria-label="Close phase menu">&times;</button>
      </div>
      <button id="all-aircraft-btn" type="button">
        <span class="home-icon">&#x2302;</span> Home
      </button>
      <ol id="phase-list"></ol>
      <div id="text-size-row">
        <span id="text-size-label">Text Size</span>
        <div id="text-size-buttons">
          <button type="button" class="text-size-btn" data-size="sm">A</button>
          <button type="button" class="text-size-btn" data-size="md">A</button>
          <button type="button" class="text-size-btn" data-size="lg">A</button>
        </div>
      </div>
    </nav>
    <div id="drawer-scrim"></div>

    <main id="checklist-main">
      <div id="phase-progress-row">
        <div id="phase-progress-label"></div>
        <button id="phase-reset-btn" type="button">Reset phase</button>
      </div>
      <ul id="item-list"></ul>
    </main>

    <footer id="app-footer">
      <button id="back-btn" class="nav-btn">Back</button>
      <div id="footer-mid">
        <span id="footer-phase-index"></span>
      </div>
      <button id="next-btn" class="nav-btn primary">Next</button>
    </footer>

  </section>

</div>

<div id="search-overlay" hidden>
  <div id="search-bar">
    <input id="search-input" type="search" placeholder="Search this checklist…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="search-close-btn" class="icon-btn" aria-label="Close search">&times;</button>
  </div>
  <ul id="search-results"></ul>
  <div id="search-empty" hidden>No matches</div>
</div>

<div id="reset-confirm" class="modal-scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-confirm-title">
    <h2 id="reset-confirm-title">Reset for new flight?</h2>
    <p id="reset-confirm-body">This clears every checked item across all phases. This can't be undone.</p>
    <div class="modal-actions">
      <button id="reset-cancel-btn" class="nav-btn">Cancel</button>
      <button id="reset-confirm-btn" class="nav-btn danger">Reset</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
